<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Valuador Dinámico Real-Time | CapacitiumX</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --main: #00f2ff; --dark: #05070a; --panel: #111418; }
        body { font-family: 'Orbitron', sans-serif; background: var(--dark); color: white; margin: 0; display: flex; height: 100vh; }
        .controls { width: 380px; background: var(--panel); padding: 25px; border-right: 1px solid var(--main); display: flex; flex-direction: column; }
        #map { flex-grow: 1; }
        .price-display { background: rgba(0, 242, 255, 0.1); border: 1px solid var(--main); padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
        .price-display h2 { font-size: 36px; margin: 10px 0; color: var(--main); text-shadow: 0 0 10px rgba(0, 242, 255, 0.5); }
        .zone-info { font-size: 14px; color: #aaa; margin-bottom: 10px; }
        .input-box { margin-bottom: 15px; }
        label { font-size: 11px; color: var(--main); letter-spacing: 1px; }
        input { width: 100%; background: #000; border: 1px solid #333; color: white; padding: 10px; border-radius: 5px; margin-top: 5px; }
        .status-pill { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 10px; background: var(--main); color: black; font-weight: bold; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="controls">
    <div class="status-pill">SISTEMA DINÁMICO ACTIVO</div>
    <div class="price-display">
        <span style="font-size: 12px;">VALOR ESTIMADO DE LA PROPIEDAD</span>
        <h2 id="livePrice">$ 0</h2>
        <div id="liveZone" class="zone-info">Mueve el pin para valuar...</div>
    </div>

    <div class="input-box">
        <label>TIPO DE PROPIEDAD</label>
        <select id="tipo" onchange="updatePrice()" style="width:100%; padding:10px; background:#000; color:white; border:1px solid #333;">
            <option value="1">Casa Habitación</option>
            <option value="1.4">Casa en Esquina / Comercial</option>
            <option value="0.9">Departamento</option>
        </select>
    </div>

    <div class="input-box">
        <label>M2 TERRENO</label>
        <input type="number" id="m2t" value="250" oninput="updatePrice()">
    </div>

    <div class="input-box">
        <label>M2 CONSTRUCCIÓN</label>
        <input type="number" id="m2c" value="220" oninput="updatePrice()">
    </div>

    <hr style="border: 0; border-top: 1px solid #333; margin: 20px 0;">
    <p style="font-size: 12px; color: #666;">* La base de datos incluye la Zona Sur (Contry, Carretera Nac.) y Centro (Plaza la Luz, Terminal).</p>
</div>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // 1. BASE DE DATOS GEOGRÁFICA (Puntos de referencia para cálculo dinámico)
    const hotZones = [
        { name: "Centro (Plaza la Luz)", lat: 25.6795, lng: -100.2891, val: 22000 },
        { name: "Zona Sur (Contry)", lat: 25.6322, lng: -100.2795, val: 26000 },
        { name: "Zona Sur (Carretera Nacional)", lat: 25.5684, lng: -100.2285, val: 21000 },
        { name: "Zona Sur (Satélite)", lat: 25.6185, lng: -100.2710, val: 17500 },
        { name: "Centro (Col. Terminal)", lat: 25.6890, lng: -100.2950, val: 14000 },
        { name: "Centro (Purísima)", lat: 25.6710, lng: -100.3210, val: 19500 },
        { name: "San Pedro (Valle)", lat: 25.6600, lng: -100.3500, val: 75000 }
    ];

    const map = L.map('map').setView([25.6322, -100.2795], 13);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

    // Marcador interactivo
    let marker = L.marker([25.6322, -100.2795], {draggable: true}).addTo(map);

    function updatePrice() {
        const pos = marker.getLatLng();
        const m2t = parseFloat(document.getElementById('m2t').value) || 0;
        const m2c = parseFloat(document.getElementById('m2c').value) || 0;
        const factorTipo = parseFloat(document.getElementById('tipo').value);

        // Algoritmo de cercanía: Encuentra la zona más próxima
        let nearestZone = hotZones[0];
        let minDistance = Infinity;

        hotZones.forEach(zone => {
            const dist = Math.sqrt(Math.pow(pos.lat - zone.lat, 2) + Math.pow(pos.lng - zone.lng, 2));
            if (dist < minDistance) {
                minDistance = dist;
                nearestZone = zone;
            }
        });

        // Simulación de variación por distancia (si te alejas del centro de la zona, el precio fluctúa levemente)
        let precioAjustado = nearestZone.val;
        
        const costoConst = 15000; // M2 construcción promedio
        let total = ((m2t * precioAjustado) + (m2c * costoConst)) * factorTipo;

        // Actualizar UI
        document.getElementById('livePrice').innerText = "$ " + Math.round(total).toLocaleString();
        document.getElementById('liveZone').innerText = "ZONA DETECTADA: " + nearestZone.name;
    }

    // Eventos de movimiento
    marker.on('drag', updatePrice); // Actualiza MIENTRAS arrastras
    marker.on('dragend', () => {
        map.panTo(marker.getLatLng());
    });

    // Iniciar cálculo
    updatePrice();
</script>

</body>
</html>
