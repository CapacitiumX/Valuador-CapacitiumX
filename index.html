<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CapacitiumX | Valuador Inmobiliario Pro</title>

    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#00f2ff">
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/1257/1257913.png">
    
    <script>
        const manifest = {
            "name": "CapacitiumX Valuador",
            "short_name": "Valuador",
            "start_url": "./",
            "display": "standalone",
            "background_color": "#05070a",
            "theme_color": "#00f2ff",
            "icons": [{
                "src": "https://cdn-icons-png.flaticon.com/512/1257/1257913.png",
                "sizes": "512x512",
                "type": "image/png"
            }]
        };
        const stringManifest = JSON.stringify(manifest);
        const blob = new Blob([stringManifest], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(blob);
        const link = document.createElement('link');
        link.rel = 'manifest';
        link.href = manifestURL;
        document.head.appendChild(link);
    </script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root { --main: #00f2ff; --dark: #05070a; --panel: #111418; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark); color: white; margin: 0; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
        
        /* Contenedor principal responsive */
        .app-container { display: flex; flex-grow: 1; overflow: hidden; }
        
        .controls { width: 380px; background: var(--panel); padding: 20px; border-right: 1px solid var(--main); overflow-y: auto; display: flex; flex-direction: column; }
        #map { flex-grow: 1; z-index: 1; }

        .price-display { background: rgba(0, 242, 255, 0.05); border: 1px solid var(--main); padding: 15px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
        .price-display h2 { font-size: 32px; margin: 5px 0; color: var(--main); }
        
        .search-box { margin-bottom: 20px; }
        input, select { width: 100%; background: #000; border: 1px solid #333; color: white; padding: 12px; border-radius: 8px; margin-top: 5px; box-sizing: border-box; font-size: 14px; }
        label { font-size: 10px; color: var(--main); font-weight: bold; text-transform: uppercase; }

        .btn-search { background: var(--main); color: black; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        
        .info-detail { font-size: 12px; color: #888; background: #000; padding: 10px; border-radius: 5px; margin-top: 10px; border-left: 3px solid var(--main); }

        @media (max-width: 768px) {
            .app-container { flex-direction: column; }
            .controls { width: 100%; height: 50%; border-right: none; border-bottom: 1px solid var(--main); }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="controls">
        <div class="price-display">
            <span style="font-size: 11px;">VALUACIÓN ESTIMADA</span>
            <h2 id="livePrice">$ 0</h2>
            <div id="liveZone" style="font-size: 12px; color: var(--main);">Cargando...</div>
        </div>

        <div class="search-box">
            <label>📍 UBICACIÓN EXACTA (Calle, Número, Ciudad)</label>
            <input type="text" id="addressInput" placeholder="Ej: Calle Morelos 123, Monterrey">
            <button class="btn-search" onclick="searchAddress()">BUSCAR Y VALUAR</button>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div class="input-box">
                <label>M2 TERRENO</label>
                <input type="number" id="m2t" value="200" oninput="updatePrice()">
            </div>
            <div class="input-box">
                <label>M2 CONST.</label>
                <input type="number" id="m2c" value="150" oninput="updatePrice()">
            </div>
        </div>

        <div class="input-box" style="margin-top: 15px;">
            <label>CALIDAD DE ACABADOS</label>
            <select id="acabados" onchange="updatePrice()">
                <option value="1">Económico / Básico</option>
                <option value="1.2">Medio (Estándar)</option>
                <option value="1.5">Semi-Lujo</option>
                <option value="2.2">Residencial Premium</option>
            </select>
        </div>

        <div id="locationDetail" class="info-detail">
            Coordenadas: Seleccione ubicación en el mapa.
        </div>
        
        <p style="font-size: 9px; color: #555; margin-top: 20px;">
            * Valuador basado en algoritmo de proximidad de CapacitiumX.
        </p>
    </div>

    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    // BASE DE DATOS GEOGRÁFICA AMPLIADA (Precio m2 Tierra)
    const hotZones = [
        { name: "Monterrey Centro", lat: 25.6714, lng: -100.3095, val: 18000 },
        { name: "Contry / Sur", lat: 25.6322, lng: -100.2795, val: 26000 },
        { name: "Carretera Nacional", lat: 25.5684, lng: -100.2285, val: 21500 },
        { name: "San Pedro Valle", lat: 25.6600, lng: -100.3500, val: 78000 },
        { name: "Cumbres", lat: 25.7200, lng: -100.3800, val: 22000 },
        { name: "Guadalupe Lindavista", lat: 25.6940, lng: -100.2370, val: 15500 },
        { name: "San Nicolás Anáhuac", lat: 25.7420, lng: -100.3000, val: 23000 }
    ];

    const map = L.map('map').setView([25.6714, -100.3095], 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png').addTo(map);

    let marker = L.marker([25.6714, -100.3095], {draggable: true}).addTo(map);

    // BUSCAR DIRECCIÓN EXACTA
    async function searchAddress() {
        const query = document.getElementById('addressInput').value;
        if (!query) return;

        try {
            const response = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}`);
            const data = await response.json();

            if (data.length > 0) {
                const newPos = { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
                marker.setLatLng([newPos.lat, newPos.lng]);
                map.setView([newPos.lat, newPos.lng], 16);
                updatePrice();
            } else {
                alert("No se encontró la ubicación. Intente ser más específico.");
            }
        } catch (error) {
            console.error("Error en búsqueda:", error);
        }
    }

    function updatePrice() {
        const pos = marker.getLatLng();
        const m2t = parseFloat(document.getElementById('m2t').value) || 0;
        const m2c = parseFloat(document.getElementById('m2c').value) || 0;
        const factorAcabados = parseFloat(document.getElementById('acabados').value);

        // Algoritmo de cercanía
        let nearestZone = hotZones[0];
        let minDistance = Infinity;

        hotZones.forEach(zone => {
            const dist = Math.sqrt(Math.pow(pos.lat - zone.lat, 2) + Math.pow(pos.lng - zone.lng, 2));
            if (dist < minDistance) {
                minDistance = dist;
                nearestZone = zone;
            }
        });

        // Cálculo de valor
        // Costo base construcción en México: ~$14,000 - $16,000 m2 para nivel medio
        const costoConstruccionBase = 15500; 
        const valorTierra = m2t * nearestZone.val;
        const valorConstruccion = (m2c * costoConstruccionBase) * factorAcabados;
        
        const total = valorTierra + valorConstruccion;

        // Actualizar UI
        document.getElementById('livePrice').innerText = "$ " + Math.round(total).toLocaleString();
        document.getElementById('liveZone').innerText = "PROXIMIDAD: " + nearestZone.name;
        document.getElementById('locationDetail').innerText = `Lat: ${pos.lat.toFixed(4)}, Lng: ${pos.lng.toFixed(4)}\nPrecio m2 Tierra: $${nearestZone.val.toLocaleString()}`;
    }

    marker.on('drag', updatePrice);
    marker.on('dragend', () => map.panTo(marker.getLatLng()));

    updatePrice();
</script>

</body>
</html>
